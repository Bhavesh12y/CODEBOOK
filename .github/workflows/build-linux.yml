name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libglib2.0-0

      - name: Install Node dependencies
        run: npm install

      - name: Create Python venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Build Linux AppImage and Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .venv/bin/activate
          npm run build
          npm run desktop:backend
          chmod +x desktop-dist/backend/cppbook-backend || true
          npx electron-builder --linux --publish always

      - name: Upload AppImage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CppBook-Linux-AppImage
          path: installer-release/*.AppImage
          if-no-files-found: error
